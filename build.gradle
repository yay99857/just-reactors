plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-da'
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        demo {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'justreactors.autoDemo', 'true'
            jvmArgument '-da'
            def demoSave = file('run/saves/New World')
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            } else if (demoSave.exists()) {
                programArguments.addAll '--quickPlaySingleplayer', 'New World'
            }
        }
        // ./gradlew runShots : DEV ONLY, builds the demo and saves screenshots to run/screenshots (client/ShotDirector)
        shots {
            client()
            systemProperty 'justreactors.shots', 'true'
            systemProperty 'justreactors.shots.ui', String.valueOf(project.findProperty('uiShots') ?: 'false')
            jvmArgument '-da'
            programArguments.addAll('--quickPlaySingleplayer', 'Shots', '--width', '1920', '--height', '1080')
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly 'maven.modrinth:jei:31.23.0.130'
    compileOnly 'maven.modrinth:jade:26.3.5+neoforge'
    compileOnly 'maven.modrinth:cc-tweaked:dNPuF2s9'
    // Roughly Enough Items (optional): REI's API exposes Architectury types
    compileOnly 'maven.modrinth:rei:26.3.824+neoforge'
    compileOnly 'maven.modrinth:architectury-api:22.1.7+neoforge'
    compileOnly 'maven.modrinth:cloth-config:26.3.161+neoforge'
}

tasks.register('syncDevMods') {
    doLast {
        def modsDir = file('run/mods')
        modsDir.mkdirs()
        def voltaicJar = file('../voltaic-dynamics/build/libs/voltaicdynamics-2.0.0.jar')
        if (voltaicJar.exists()) {
            copy {
                from voltaicJar
                into modsDir
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['prepareClientRun', 'prepareDemoRun', 'prepareShotsRun', 'prepareServerRun', 'prepareGameTestServerRun']) {
        task.dependsOn 'syncDevMods'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var modMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modMetadata
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
}
