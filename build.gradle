plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

// Forge 1.20.1 backport of Just Reactors (branch 1.20.1). Data files are kept as plain JSON here:
// the datagen providers live on the newer branches only.
version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-da'
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        demo {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'justreactors.autoDemo', 'true'
            jvmArgument '-da'
            def demoSave = file('run/saves/New World')
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            } else if (demoSave.exists()) {
                programArguments.addAll '--quickPlaySingleplayer', 'New World'
            }
        }
        // ./gradlew runShots : DEV ONLY, builds the demo and saves screenshots to run/screenshots (client/ShotDirector)
        shots {
            client()
            systemProperty 'justreactors.shots', 'true'
            systemProperty 'justreactors.shots.ui', String.valueOf(project.findProperty('uiShots') ?: 'false')
            jvmArgument '-da'
            programArguments.addAll('--quickPlaySingleplayer', 'Shots', '--width', '1920', '--height', '1080')
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runGameTestServer : runs every @GameTest and exits (non-zero on failure)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    modCompileOnly 'maven.modrinth:jei:15.75.0.243'
    modCompileOnly 'maven.modrinth:jade:11.13.3+forge'
    modCompileOnly 'maven.modrinth:cc-tweaked:YFHKowXT'
    // Optional recipe viewers: REI (needs Architectury + Cloth Config types) and EMI
    modCompileOnly 'maven.modrinth:rei:12.1.785+forge'
    modCompileOnly 'maven.modrinth:architectury-api:9.2.14+forge'
    modCompileOnly 'maven.modrinth:cloth-config:11.1.136+forge'
    modCompileOnly 'maven.modrinth:emi:1.1.24+1.20.1+forge'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

var modMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/mods.toml') {
        expand modMetadata
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
}
